[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dexray"
version = "0.1.0"
description = "Decode any DEX swap from raw on-chain transactions. No paid APIs required."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "DexRay Contributors"},
]
keywords = ["solana", "dex", "swap", "parser", "blockchain", "defi", "trading"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
ws = ["websockets>=11.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/dexray"
Repository = "https://github.com/YOUR_USERNAME/dexray"
Issues = "https://github.com/YOUR_USERNAME/dexray/issues"

[tool.setuptools.packages.find]
include = ["dexray*"]
